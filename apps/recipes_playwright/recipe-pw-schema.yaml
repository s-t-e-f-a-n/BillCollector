---
$schema: "http://json-schema.org/draft-07/schema#"
title: "Recipe Playwright YAML Schema"
type: object
properties:
  $schema:
    type: string
  services:
    type: array
    items:
      type: object
      required:
        - serviceName
        - steps
      properties:
        serviceName:
          type: string
        description:
          type: string
        steps:
          type: array
          items:
            $ref: "#/definitions/step"
definitions:
  step:
    type: object
    required:
      - step
    properties:
      step:
        type: integer
      description:
        type: string
      graceful:
        type: boolean
        description: >-
          If true, a failure of this step is recorded in the log and the DB but
          the run continues with the next step. If false (default), a failure
          aborts the run.
      methods:
        type: array
        items:
          $ref: "#/definitions/method"
      steps:
        type: array
        items:
          $ref: "#/definitions/nestedStep"
      phases:
        type: array
        minItems: 1
        items:
          type: object
          required: [submit, success]
          additionalProperties: false
          properties:
            success:
              type: object
            steps:
              type: array
              items:
                $ref: "#/definitions/step"
            submit:
              $ref: "#/definitions/step"
      submit:
        $ref: "#/definitions/step"
    allOf:
      - if:
          required: [ methods ]
          properties:
            methods:
              contains:
                type: object
                properties:
                  method:
                    enum: [ "click_until_absent", "download_all" ]
                required: [ method ]
        then:
          properties:
            graceful:
              const: false
            methods:
              type: array
              minItems: 2
              maxItems: 2
              items:
                - $ref: "#/definitions/collectionLocatorMethod"
                - $ref: "#/definitions/collectionActionMethod"
              additionalItems: false
          not:
            required: [ steps ]
  nestedStep:
    type: object
    required: [ step ]
    properties:
      step:
        type: integer
      description:
        type: string
      graceful:
        type: boolean
      methods:
        type: array
        items:
          $ref: "#/definitions/method"
      steps:
        type: array
        items:
          $ref: "#/definitions/nestedStep"
    allOf:
      - not:
          required: [ methods ]
          properties:
            methods:
              contains:
                type: object
                required: [ method ]
                properties:
                  method:
                    enum: [ "click_until_absent", "download_all" ]
  method:
    oneOf:
      - $ref: "#/definitions/playwrightMethod"
      - $ref: "#/definitions/clickUntilAbsentMethod"
      - $ref: "#/definitions/downloadAllMethod"
  collectionLocatorMethod:
    type: object
    required: [ method ]
    additionalProperties: false
    properties:
      method:
        enum:
          - locator
          - get_by_role
          - get_by_label
          - get_by_text
          - get_by_title
          - get_by_placeholder
          - get_by_test_id
      arguments:
        type: array
        items:
          type: object
          additionalProperties:
            type: [ "string", "boolean", "number", "object", "null" ]
  collectionActionMethod:
    oneOf:
      - $ref: "#/definitions/clickUntilAbsentMethod"
      - $ref: "#/definitions/downloadAllMethod"
  playwrightMethod:
    type: object
    required:
      - method
    properties:
      method:
        type: string
        not:
          enum: [ "click_until_absent", "download_all" ]
      arguments:
        type: array
        items:
          type: object
          additionalProperties:
            type: [ "string", "boolean", "number", "object", "null" ]
  clickUntilAbsentMethod:
    type: object
    required: [ method, arguments ]
    additionalProperties: false
    properties:
      method:
        const: "click_until_absent"
      arguments:
        type: array
        minItems: 1
        maxItems: 1
        items:
          type: object
          required: [ progress_selector, max_clicks, timeout_ms ]
          additionalProperties: false
          properties:
            progress_selector:
              type: string
              minLength: 1
              pattern: ".*\\S.*"
            max_clicks:
              type: integer
              minimum: 1
              maximum: 100
            timeout_ms:
              type: integer
              minimum: 1
              maximum: 120000
  downloadAllMethod:
    type: object
    required: [ method, arguments ]
    additionalProperties: false
    properties:
      method:
        const: "download_all"
      arguments:
        type: array
        minItems: 1
        maxItems: 1
        items:
          type: object
          required: [ key_attribute, max_items, timeout_ms, event_window_ms ]
          additionalProperties: false
          properties:
            key_attribute:
              type: string
              minLength: 1
              pattern: ".*\\S.*"
            max_items:
              type: integer
              minimum: 1
              maximum: 200
            timeout_ms:
              type: integer
              minimum: 1
              maximum: 600000
            event_window_ms:
              type: integer
              minimum: 1
              maximum: 10000
additionalProperties: false
