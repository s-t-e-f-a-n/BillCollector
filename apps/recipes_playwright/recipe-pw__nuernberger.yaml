$schema: recipe-pw-schema.yaml
services:
- serviceName: nuernberger
  description: ''
  steps:
  - step: 1
    description: ''
    methods:
    - method: goto
      arguments:
      - url: "https://meine.nuernberger.de/kunde/pages/startseite.html"
  - step: 2
    description: ''
    methods:
    - method: get_by_placeholder
      arguments:
      - text: "z. B. meinBenutzername"
    - method: click
  - step: 3
    description: ''
    methods:
    - method: get_by_placeholder
      arguments:
      - text: "z. B. meinBenutzername"
    - method: fill
      arguments:
      - value: "{{USERNAME}}"
  - step: 4
    description: ''
    methods:
    - method: get_by_placeholder
      arguments:
      - text: "Passwort"
    - method: click
  - step: 5
    description: ''
    methods:
    - method: get_by_placeholder
      arguments:
      - text: "Passwort"
    - method: fill
      arguments:
      - value: "{{PASSWORD}}"
  - step: 6
    description: ''
    methods:
    - method: get_by_role
      arguments:
      - role: "button"
      - name: "Anmelden"
    - method: click
  - step: 7
    description: ''
    methods:
    - method: get_by_role
      arguments:
      - role: "link"
      - name: "Postfach"
      - exact: true
    - method: click
  - step: 8
    description: ''
    methods:
    - method: expect_download
    steps:
    - step: 9
      description: ''
      methods:
      - method: get_by_role
        arguments:
        - role: "link"
        - name: "Leistungsabrechnung PDF"
      - method: first
      - method: click
  - step: 10
    description: ''
    methods:
    - method: expect_download
    steps:
    - step: 11
      description: ''
      methods:
      - method: get_by_role
        arguments:
        - role: "link"
        - name: "Vertragsinformation PDF"
      - method: first
      - method: click
  - step: 12
    description: ''
    methods:
    - method: close
