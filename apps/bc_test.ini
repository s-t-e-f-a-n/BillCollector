; BillCollector test INI (section [Playwright]).
;
; Each entry is one web service (portal) to collect from. On the daemon's
; first start (while the task list is still empty) every (service, user)
; pair below is imported as a task, initially disabled with a default
; monthly cron; you then enable a task and set its cron per task in the UI.
; The onboarding wizard's "Import from INI" re-adds any (service, user)
; pairs missing from the task table.
;
; Format:
;   <ServiceName>=<user1>, <user2>, ...
; where <ServiceName> matches the Name of the service's Vaultwarden entry
; and each <userN> is a separate account at that service (for example,
; family members with different logins at the same provider). A blank value
; imports one task with an empty account.
;
; The shipped file intentionally contains no personal accounts: add your own
; services and accounts below (uncomment and edit), then re-import.
;
; Synthetic example (commented out - not imported):
;   ExampleMobile=John, Jane
;   ExampleUtility=

[Playwright]
