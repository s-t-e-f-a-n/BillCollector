[pytest]
testpaths = tests
# NiceGUI testing framework: the User fixture (no browser). The packaged
# nicegui.testing.plugin also pulls in selenium for the Screen fixture,
# which this repo's committed suite does not use (M2 risk section).
addopts = -p nicegui.testing.user_plugin
# The nicegui.testing user fixture is an async fixture (needs a loop).
asyncio_mode = auto
# Main file executed by the user fixture for UI tests (fresh temp DB per test).
main_file = tests/ui_test_main.py
